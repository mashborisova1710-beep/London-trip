name: Deploy RenPy Web from ZIP
on:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p build_web
          unzip -o *.zip -d build_web
          
          # Умный поиск: если файлы оказались во вложенной папке, вытаскиваем их в корень build_web
          INTERNAL_DIR=$(find build_web -maxdepth 2 -name "index.html" -exec dirname {} \;)
          if [ "$INTERNAL_DIR" != "build_web" ] && [ ! -z "$INTERNAL_DIR" ]; then
            echo "Файлы найдены в $INTERNAL_DIR, переношу в корень..."
            mv $INTERNAL_DIR/* build_web/ 2>/dev/null || true
            mv $INTERNAL_DIR/.* build_web/ 2>/dev/null || true
          fi
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build_web'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
